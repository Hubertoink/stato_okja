# StatO for ZimaOS
# Import: App Center -> Install a customized app -> Import
# Only the seven ${...} values below appear in the ZimaOS setup form.

name: stato-zimaos

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 5

x-casaos:
  id: org.stato.zimaos
  main: frontend
  title:
    de_DE: StatO
    en_US: StatO
  author: StatO
  developer: StatO
  category: Others
  version: "1.6.0"
  architectures: [amd64, arm64]
  icon: https://raw.githubusercontent.com/Hubertoink/stato_okja/main/frontend/assets/Stato_Logo.png
  description:
    de_DE: Datenschutzfreundliche Statistik und Dokumentation für die Offene Kinder- und Jugendarbeit.
    en_US: Privacy-friendly statistics and documentation for open child and youth work.
  tagline:
    de_DE: Statistik und Dokumentation für die OKJA
    en_US: Statistics and documentation for open child and youth work
  scheme: http
  index: /
  port_map: "${WEBUI_PORT:-8088}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: stato_prod
      POSTGRES_USER: stato_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required - use a long random password}
      TZ: Europe/Berlin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U stato_user -d stato_prod"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardened
    image: ghcr.io/hubertoink/stato-backend:${STATO_VERSION:-1.6.0}
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      APP_ENV: production
      TZ: Europe/Berlin
      APP_ORIGIN: ${STATO_URL:?Required - for example http://192.168.1.50:8088}
      CORS_ORIGINS: ${STATO_URL:?Required - for example http://192.168.1.50:8088}
      AUTH_REFRESH_COOKIE_SECURE: ${STATO_HTTPS:-false}
      DB_HOST: postgres
      DB_USERNAME: stato_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Required - use a long random password}
      DB_DATABASE: stato_prod
      JWT_SECRET: ${JWT_SECRET:?Required - use at least 48 random characters}
      PASSWORD_RESET_MODE: admin_temp_password
      USER_PROVISIONING_MODE: local
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@stato.local}
      INITIAL_SETUP_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      start_period: 20s

  frontend:
    <<: *hardened
    image: ghcr.io/hubertoink/stato-frontend:onprem-${STATO_VERSION:-1.6.0}
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    # ZimaOS starts services asynchronously.  Do not wait for a health state
    # here: Nginx can serve the UI immediately and will proxy /api once the
    # backend is ready.
    depends_on: [backend]
    ports:
      - target: 8080
        published: ${WEBUI_PORT:-8088}
        protocol: tcp
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      start_period: 10s

  backup:
    <<: *hardened
    image: ghcr.io/hubertoink/stato-backup:${STATO_VERSION:-1.6.0}
    tmpfs: [/tmp]
    environment:
      PGHOST: postgres
      PGUSER: stato_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?Required - use a long random password}
      PGDATABASE: stato_prod
      BACKUP_OUTPUT_DIR: /backups
      BACKUP_UPLOADS_DIR: /mnt/uploads
      BACKUP_RETENTION_DAYS: "14"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/mnt/uploads:ro
      - backup-data:/backups

volumes:
  postgres-data:
  backend-uploads:
  backup-data:
