<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Desktop-Updates</title>
    <link rel="stylesheet" href="server-switch.css" />
    <link rel="stylesheet" href="updates.css" />
    <script src="updates.js" defer></script>
  </head>
  <body>
    <dialog aria-labelledby="heading" aria-describedby="status">
      <header>
        <h1 id="heading">Desktop-Updates</h1>
        <button id="close" class="close" type="button" aria-label="Schließen" autofocus>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <p class="version">Version <span id="current-version"></span></p>
      <p id="status" role="status" aria-live="polite"></p>
      <progress id="progress" max="100" aria-label="Download-Fortschritt" hidden></progress>
      <p id="last-check" class="hint"></p>
      <p id="save-hint" class="hint" hidden>Bitte offene Eingaben vor dem Neustart speichern.</p>
      <footer>
        <button id="check-update" class="primary" type="button">Jetzt prüfen</button>
        <button id="download-update" class="primary" type="button" hidden>Update herunterladen</button>
        <button id="install-update" class="primary" type="button" hidden>Neu starten &amp; installieren</button>
      </footer>
    </dialog>
  </body>
</html>
