version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stato_dev
      POSTGRES_USER: stato_user
      POSTGRES_PASSWORD: stato_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stato_user -d stato_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: stato-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Optional: MinIO Client für Bucket-Setup
  minio-setup:
    image: minio/mc:latest
    container_name: stato-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/stato-attachments --ignore-existing;
      /usr/bin/mc policy set download myminio/stato-attachments;
      echo 'MinIO bucket setup complete';
      exit 0;
      "

  # Local SMTP testing server (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: stato-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  default:
    name: stato-network
