# Runtime definition for the published On-Prem release bundle. It deliberately
# contains no build contexts: production installs pull the release images.
name: stato-onprem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stato_prod}
      POSTGRES_USER: ${POSTGRES_USER:-stato_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend-db]

  backend:
    image: ghcr.io/hubertoink/stato-backend:${STATO_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-production}
      STRICT_SECURITY_MODE: ${STRICT_SECURITY_MODE:-true}
      PORT: 3000
      TZ: ${TZ:-Europe/Berlin}
      API_PREFIX: ${API_PREFIX:-api}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-stato_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_DATABASE: ${POSTGRES_DB:-stato_prod}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      DB_BOOTSTRAP_ON_EMPTY: ${DB_BOOTSTRAP_ON_EMPTY:-true}
      DB_LOGGING: ${DB_LOGGING:-false}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_TTL: ${AUTH_RATE_LIMIT_TTL:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-10}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DB_REQUIRE_SSL: ${DB_REQUIRE_SSL:-false}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-}
      INVITE_TOKEN_EXPIRATION: ${INVITE_TOKEN_EXPIRATION:-24h}
      RESET_TOKEN_EXPIRATION: ${RESET_TOKEN_EXPIRATION:-1h}
      AUTH_2FA_ENABLED: ${AUTH_2FA_ENABLED:-false}
      AUTH_2FA_CODE_TTL: ${AUTH_2FA_CODE_TTL:-600}
      PASSWORD_RESET_MODE: ${PASSWORD_RESET_MODE:-email}
      USER_PROVISIONING_MODE: ${USER_PROVISIONING_MODE:-email}
      PUBLIC_APP_NAME: ${PUBLIC_APP_NAME:-StatO}
      PUBLIC_ORG_NAME: "${PUBLIC_ORG_NAME:-}"
      PUBLIC_LOGIN_SUBTITLE: ${PUBLIC_LOGIN_SUBTITLE:-OKJA Statistik & Dokumentation}
      PUBLIC_LIVE_REFRESH_INTERVAL_MS: ${PUBLIC_LIVE_REFRESH_INTERVAL_MS:-30000}
      STATS_OVERVIEW_CACHE_TTL_MS: ${STATS_OVERVIEW_CACHE_TTL_MS:-0}
      # Editable, organisation-specific legal documents (mounted read-only below)
      LEGAL_CONTENT_DIR: ${LEGAL_CONTENT_DIR:-/app/legal}

      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@example.org}
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD:-}"
      SUPERADMIN_EMAIL_FORCE: ${SUPERADMIN_EMAIL_FORCE:-false}
      SUPERADMIN_PASSWORD_FORCE: ${SUPERADMIN_PASSWORD_FORCE:-false}
      INITIAL_SETUP_ENABLED: ${INITIAL_SETUP_ENABLED:-false}
      ENABLE_ORG_MOVE: ${ENABLE_ORG_MOVE:-false}
      # Global ProcessO switch. Individual organisations still need to be enabled by a superadmin.
      ENABLE_PROCESSES: ${ENABLE_PROCESSES:-true}

      # SMTP (optional)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: ${SMTP_FROM:-no-reply@stato.local}

    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persistiert /uploads (u.a. /uploads/images)
      - backend-uploads:/app/uploads
      - ${LEGAL_CONTENT_DIR_HOST:-./config/legal}:${LEGAL_CONTENT_DIR:-/app/legal}:ro
    networks: [frontend-backend, backend-db]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    # The On-Prem tag is deliberately separate from the public web frontend.
    # It is built with nginx.proxy.conf and can therefore reach only the
    # backend service in this Compose network.
    image: ghcr.io/hubertoink/stato-frontend:${STATO_FRONTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    networks: [frontend-backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optionaler interner HTTPS-Einstieg. Der Installer aktiviert dieses Profil
  # bei STATO_TLS_MODE=internal und bindet den HTTP-Frontend-Port dann nur an
  # 127.0.0.1. Caddy spricht den Frontend-Service direkt im Docker-Netz an.
  caddy:
    image: caddy:2-alpine
    profiles: ["internal-tls"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      STATO_PUBLIC_HOST: ${STATO_PUBLIC_HOST:-}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend-backend]

  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/hubertoink/stato-backup:${STATO_IMAGE_TAG:-local}}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-stato_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-stato_prod}
      BACKUP_OUTPUT_DIR: /backups
      BACKUP_UPLOADS_DIR: /mnt/uploads
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/mnt/uploads:ro
      - backup-data:/backups
    networks: [backend-db]

  # Optional: lokale SMTP-Testbox (Mailpit)
  # mailpit:
  #   image: axllent/mailpit:latest
  #   restart: unless-stopped
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   networks: [frontend-backend]

volumes:
  postgres-data:
    name: stato-onprem-postgres-data
  backend-uploads:
    name: stato-onprem-backend-uploads
  backup-data:
    name: stato-onprem-backup-data
  caddy-data:
    name: stato-onprem-caddy-data
  caddy-config:
    name: stato-onprem-caddy-config

networks:
  frontend-backend:
    name: stato-onprem-frontend-backend
  backend-db:
    name: stato-onprem-backend-db
