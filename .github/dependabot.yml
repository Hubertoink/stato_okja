version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      backend-runtime:
        patterns:
          - "@nestjs/common"
          - "@nestjs/config"
          - "@nestjs/core"
          - "@nestjs/jwt"
          - "@nestjs/passport"
          - "@nestjs/platform-express"
          - "@nestjs/swagger"
          - "@nestjs/throttler"
          - "@nestjs/typeorm"
          - "archiver"
          - "bcryptjs"
          - "body-parser"
          - "class-transformer"
          - "class-validator"
          - "dotenv"
          - "express"
          - "helmet"
          - "jszip"
          - "multer"
          - "nodemailer"
          - "passport"
          - "passport-jwt"
          - "pg"
          - "pg-query-stream"
          - "qs"
          - "reflect-metadata"
          - "rxjs"
          - "sharp"
          - "sql.js"
          - "typeorm"
          - "yaml"
        update-types: [minor, patch]
      frontend-runtime:
        patterns:
          - "@fontsource/inter"
          - "@tanstack/query-sync-storage-persister"
          - "@tanstack/react-query"
          - "@tanstack/react-query-persist-client"
          - "@types/qrcode"
          - "@xyflow/react"
          - "axios"
          - "dompurify"
          - "elkjs"
          - "form-data"
          - "html2canvas"
          - "i18next"
          - "jspdf"
          - "lucide-react"
          - "qrcode"
          - "react"
          - "react-dom"
          - "react-i18next"
          - "react-router-dom"
          - "react-simple-wysiwyg"
          - "recharts"
          - "xlsx-js-style"
        update-types: [minor, patch]
      development-tools:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # ts-jest currently needs the TypeScript 5 compiler API.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@nestjs/jwt"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    ignore:
      # Keep the runtime aligned with package.json (Node 24 LTS).
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      backend-docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Berlin
    ignore:
      # Keep the runtime aligned with package.json (Node 24 LTS).
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      frontend-docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
    ignore:
      # PostgreSQL major upgrades require a separate compatibility review.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
