name: StatO Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'VERSION'
      - 'package.json'
      - 'scripts/check-version.mjs'
      - '.github/workflows/desktop.yml'
  push:
    branches: [dev, main]
    paths:
      - 'desktop/**'
      - 'VERSION'
      - 'package.json'
      - 'scripts/check-version.mjs'
      - '.github/workflows/desktop.yml'
    tags: ['v*', 'desktop-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Check version
        run: node scripts/check-version.mjs
      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = if ($env:GITHUB_REF_NAME.StartsWith('desktop-')) { "desktop-v$version" } else { "v$version" }
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Release tag must be $expectedTag" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must reference a commit from main' }
      - name: Test connection and Electron client
        run: npm run desktop:test
      - name: Build Windows preview installer
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = Get-Item "desktop/dist/StatO-Setup-$version-x64.exe"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/desktop/dist/SHA256SUMS", "$hash  $($installer.Name)`n", [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7
        with:
          name: stato-windows-preview
          path: |
            desktop/dist/StatO-Setup-*.exe
            desktop/dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stato-desktop-test-artifacts
          path: desktop/dist/test-artifacts/
          if-no-files-found: ignore

  release:
    name: Publish Windows desktop preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stato-windows-preview
          path: release-assets
      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          assets=("release-assets/StatO-Setup-$version-x64.exe" release-assets/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --prerelease --latest=false \
              --title "StatO Desktop $version – Windows-Vorschau" \
              --notes-file desktop/RELEASE_NOTES.md
          fi
