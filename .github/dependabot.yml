version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # ts-jest currently needs the TypeScript 5 compiler API.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@nestjs/jwt"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    ignore:
      # Keep the runtime aligned with package.json (Node 24 LTS).
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      backend-docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Berlin
    ignore:
      # Keep the runtime aligned with package.json (Node 24 LTS).
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      frontend-docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
    ignore:
      # PostgreSQL major upgrades require a separate compatibility review.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
