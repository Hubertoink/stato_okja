server {
    listen 80;
    server_name _;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; block-all-mixed-content" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # Allow larger uploads (images up to 20MB)
    client_max_body_size 20M;

    # DNS resolver for upstream HTTPS domain and sane timeouts
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Safety net: if the SPA still calls /api or /uploads (e.g. cached older build),
    # proxy to the public backend domain to avoid 405s.
    location /api/ {
        proxy_pass https://api.stato-okja.de/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.stato-okja.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_name api.stato-okja.de;
        proxy_ssl_server_name on;
    }

    location /uploads/ {
        proxy_pass https://api.stato-okja.de/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host api.stato-okja.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_name api.stato-okja.de;
        proxy_ssl_server_name on;
    }
}
